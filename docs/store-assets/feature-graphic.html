<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Feature Graphic — Budget Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #FAFAF7; --surface: #FFFFFF; --ink: #15151A; --ink-2: #6E6E73;
      --hairline: rgba(60,60,67,0.12); --brand: #5046E6; --brand-tint: #EEEDFD;
      --essentials: #4A6FA5; --growth: #5C8A6B; --rewards: #B5755C;
      --essentials-t: #E3EBF4; --growth-t: #E4EEE7; --rewards-t: #F2E4DE;
    }
    html, body { width: 1024px; height: 500px; overflow: hidden; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(120deg, #FAFAF7 0%, #FAFAF7 52%, #EEEDFD 100%);
      display: flex; align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    /* exact-size export wrapper */
    .graphic { width: 1024px; height: 500px; position: relative; display: flex; align-items: center; }

    /* LEFT: copy */
    .left { width: 600px; padding: 0 0 0 72px; }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
    .logo .glyph {
      width: 40px; height: 40px; background: var(--brand); border-radius: 11px;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .logo .glyph svg { width: 22px; height: 22px; }
    .logo .word { font-weight: 700; font-size: 20px; letter-spacing: -0.01em; color: var(--ink); }
    h1 {
      font-size: 52px; line-height: 1.05; letter-spacing: -0.025em;
      font-weight: 800; color: var(--ink); margin-bottom: 20px;
    }
    h1 .accent { color: var(--brand); }
    .sub { font-size: 19px; color: var(--ink-2); font-weight: 400; line-height: 1.45; max-width: 440px; }
    .pills { display: flex; gap: 10px; margin-top: 32px; }
    .pill {
      font-size: 13px; font-weight: 500; color: var(--ink); background: var(--surface);
      border: 1px solid var(--hairline); border-radius: 999px; padding: 8px 16px;
    }

    /* RIGHT: phone mockup */
    .right { flex: 1; display: flex; align-items: center; justify-content: center; height: 100%; position: relative; }
    .phone {
      width: 290px; height: 590px; background: var(--bg);
      border: 11px solid #1B1B1F; border-radius: 42px; overflow: hidden;
      box-shadow: 0 40px 80px rgba(21,21,26,0.22), 0 8px 20px rgba(21,21,26,0.10);
      position: absolute; top: 64px; rotate: -4deg;
    }
    .statusbar { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 14px 22px 0; font-size: 12px; font-weight: 600; color: var(--ink); }
    .screen { padding: 8px 20px 0; }
    .gear { display: flex; justify-content: flex-end; padding: 6px 0; opacity: 0.8; }
    .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-2); margin: 10px 0 6px; }
    .hero { font-size: 50px; font-weight: 600; letter-spacing: -1px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .hero .sym { font-size: 26px; font-weight: 500; }
    .days { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
    .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; margin-top: 24px; overflow: hidden; }
    .bar { padding: 13px 16px; border-bottom: 1px solid var(--hairline); }
    .bar:last-child { border-bottom: none; }
    .bar .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .bar .lbl { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .bar .amt { font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    .track { height: 8px; border-radius: 4px; overflow: hidden; }
    .fill { height: 100%; border-radius: 4px; }
    .fab {
      position: absolute; right: 22px; bottom: 26px; width: 52px; height: 52px;
      background: var(--brand); border-radius: 26px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 16px rgba(80,70,230,0.35);
    }
    .fab svg { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <div class="graphic">
    <div class="left">
      <div class="logo">
        <span class="glyph">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="word">Budget Tracker</span>
      </div>
      <h1>A budget you<br><span class="accent">actually live in.</span></h1>
      <p class="sub">See what's safe to spend today. Log a coffee in three taps. Stay on plan — calmly.</p>
      <div class="pills">
        <span class="pill">Private by default</span>
        <span class="pill">No streaks. No noise.</span>
      </div>
    </div>

    <div class="right">
      <div class="phone">
        <div class="statusbar"><span>9:41</span><span>● ● ●  ▮</span></div>
        <div class="screen">
          <div class="gear">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="#15151A" stroke-width="1.6"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H22a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="#15151A" stroke-width="1.5"/></svg>
          </div>
          <div class="eyebrow">Safe to spend today</div>
          <div class="hero"><span class="sym">₦</span>3,403</div>
          <div class="days">15 days to go this month</div>
          <div class="card">
            <div class="bar">
              <div class="top"><span class="lbl"><span class="dot" style="background:var(--essentials)"></span>Essentials</span><span class="amt">₦75,424</span></div>
              <div class="track" style="background:var(--essentials-t)"><div class="fill" style="width:42%;background:var(--essentials)"></div></div>
            </div>
            <div class="bar">
              <div class="top"><span class="lbl"><span class="dot" style="background:var(--growth)"></span>Growth</span><span class="amt">₦52,813</span></div>
              <div class="track" style="background:var(--growth-t)"><div class="fill" style="width:18%;background:var(--growth)"></div></div>
            </div>
            <div class="bar">
              <div class="top"><span class="lbl"><span class="dot" style="background:var(--rewards)"></span>Rewards</span><span class="amt">₦17,425</span></div>
              <div class="track" style="background:var(--rewards-t)"><div class="fill" style="width:62%;background:var(--rewards)"></div></div>
            </div>
          </div>
        </div>
        <div class="fab">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.6" stroke-linecap="round"/></svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
